name: Deployment E2E
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Current top PR number
        required: true
        type: string
      sha:
        description: Exact immutable top head SHA
        required: true
        type: string
      force_failure:
        description: Deliberate E2E job failure for teaching
        type: boolean
        default: false
permissions: {}
# Serialize requests for each PR. Do not cancel a deployment reporter.
concurrency:
  group: deployment-e2e-pr-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  open:
    name: Open Exact SHA Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.open.outputs.deployment_id }}
      head: ${{ steps.open.outputs.head }}
      base: ${{ steps.open.outputs.base }}
      snapshot: ${{ steps.open.outputs.snapshot }}
    steps:
      # No checkout, PR code, artifacts, or environment secrets in write-token jobs.
      # No job.environment: it would auto-create a deployment for the dispatch ref.
      - name: Validate And Record Exact SHA
        id: open
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Dispatch this trusted workflow from main only.');
            const number = Number(process.env.PR_NUMBER);
            const expected = process.env.EXPECTED_SHA;
            if (!Number.isSafeInteger(number) || number < 1 || !/^[0-9a-f]{40}$/.test(expected)) throw new Error('Use a PR number and full SHA.');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.state !== 'open' || pr.head.sha !== expected || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('PR is closed, foreign, or has a different head.');
            const s = pr.stack;
            if (s && s.position !== s.size) throw new Error('Only the current stack tip can deploy.');
            const base = s ? s.base : pr.base;
            if (base.ref !== 'main') throw new Error('This teaching gate targets main.');
            let members = [{number, sha: pr.head.sha}];
            if (s) {
              const {data: stack} = await github.request('GET /repos/{owner}/{repo}/stacks/{stack_number}', {...context.repo, stack_number: s.number});
              members = stack.pull_requests.filter(p => p.state === 'open').map(p => ({number:p.number, sha:p.head.sha}));
              if (members.length !== s.size || members.at(-1)?.number !== number) throw new Error('Membership changed while reading the stack.');
            }
            let parent = base.sha;
            for (const member of members) {
              const {data: diff} = await github.rest.repos.compareCommitsWithBasehead({...context.repo, basehead:`${parent}...${member.sha}`});
              if (!['ahead','identical'].includes(diff.status)) throw new Error('Rebase the stack to a linear history before deploying.');
              parent = member.sha;
            }
            const snapshot = {pr:number, head:expected, base:base.sha, stack:s ? s.number : null, members};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Keep GitHub branch association; verify the resolved SHA before any tests.
            const {data: deployment} = await github.rest.repos.createDeployment({
              ...context.repo, ref:pr.head.ref, environment:'stack-e2e', auto_merge:false,
              required_contexts:[], transient_environment:true, production_environment:false,
              description:'Ephemeral local HTTP E2E; no external service is deployed.',
              payload:{...snapshot, run_id:context.runId, run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT)}
            });
            if (!deployment.id || deployment.sha !== expected) throw new Error('Deployment SHA did not match the requested commit.');
            core.setOutput('deployment_id', String(deployment.id));
            core.setOutput('head', expected);
            core.setOutput('base', base.sha);
            core.setOutput('snapshot', JSON.stringify(snapshot));
            await github.rest.repos.createDeploymentStatus({...context.repo, deployment_id:deployment.id, state:'in_progress', log_url:runUrl, auto_inactive:false});
            core.info(JSON.stringify({deployment_id:deployment.id, ...snapshot}));
            await core.summary.addHeading('Exact SHA deployment').addCodeBlock(JSON.stringify({deployment_id:deployment.id, ...snapshot}, null, 2)).write();
  test:
    name: Test Read Only Revision
    needs: open
    permissions:
      contents: read
    uses: $/.github/workflows/reusable-ci.yaml
    with:
      head: ${{ needs.open.outputs.head }}
      base: ${{ needs.open.outputs.base }}
      expensive: true
      delay: 0s
      force_failure: ${{ inputs.force_failure }}
