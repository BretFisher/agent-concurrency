name: Stack Cancel Demo
on:
  push:
    branches: ['stack-lab/**']
  pull_request:
    # stacked is supported live, although older actionlint schemas reject it.
    types: [opened, synchronize, reopened, stacked]
  workflow_dispatch:
permissions: {}
# cancel any previously-started, yet still active runs of this workflow on the same branch
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  cancel:
    name: Cancel Lower Stack Runs
    # Fresh API checks in the script decide stack membership and top position.
    # Event metadata alone would miss PRs linked after their opening event.
    if: >-
      ${{ vars.STACK_CLEANUP_ENABLED == 'true' &&
          contains(fromJSON('["pull_request","push"]'), github.event_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # Bash, gh, jq, and base64 are prerequisites on this GitHub-hosted image.
      # Only the trusted default-branch script runs with the write-capable token.
      - name: Cancel Earlier Lower PR Runs
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: ${{ github.event.repository.default_branch }}
          STACK_CANCEL_EVENTS: pull_request,push
        run: |
          set -euo pipefail
          trusted_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TRUSTED_BRANCH" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/cancel-lower-stack-runs.sh?ref=$trusted_sha" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/stack-cancel.sh"
          bash "$RUNNER_TEMP/stack-cancel.sh"
  work:
    name: Simulated Validation
    # No needs: cancel. Cleanup neither gates nor certifies validation.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions: {}
    steps:
      - name: Simulate Active Work
        run: |
          set -euo pipefail
          echo 'Cancellation timing probe only; this delay proves no application behavior.'
          sleep 120
