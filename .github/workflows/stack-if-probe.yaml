name: Stack If Probe
on:
  push:
    branches: ['stack-lab/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, stacked]
  workflow_dispatch:
permissions: {}
# cancel any previously-started, yet still active runs of this workflow on the same branch
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  observe:
    name: Record Event State
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      - name: Record Snapshot And Current State
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const p = context.payload.pull_request;
            const snapshot = {event: context.eventName, action: context.payload.action || null, pr: p?.number || null, stack: p?.stack || null, sha: context.sha, ref: context.ref};
            let current = null;
            if (p) {
              const {data} = await github.rest.pulls.get({...context.repo, pull_number:p.number});
              current = {pr:data.number, head:data.head.sha, stack:data.stack || null};
            }
            const evidence = {snapshot, current};
            core.info(JSON.stringify(evidence));
            await core.summary.addHeading('Stack event evidence').addCodeBlock(JSON.stringify(evidence,null,2),'json').write();
  conditional:
    name: Conditional Validation Probe
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.stack == null ||
          github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Simulate Active Validation
        env:
          PROBE_SECONDS: ${{ vars.STACK_PROBE_SECONDS || '0' }}
        run: |
          set -euo pipefail
          echo 'This is a scheduling probe, not an application correctness test.'
          [[ "$PROBE_SECONDS" =~ ^[0-9]{1,3}$ ]] && ((PROBE_SECONDS <= 180))
          sleep "$PROBE_SECONDS"
