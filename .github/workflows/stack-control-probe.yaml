name: Stack Control Probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  probe:
    name: Simulate Active Work
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {}
    steps:
      - name: Hold Test Run Active
        run: sleep 180
