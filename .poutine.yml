# Test jobs must execute PR code. They have read-only tokens and no secrets.
# This exception is limited to the shared test workflow.
skip:
  - rule: untrusted_checkout_exec
    path: .github/workflows/reusable-ci.yaml
  # This is the repository's own SHA-pinned experimental action, not an
  # external Marketplace action. Creator verification is not applicable.
  - rule: github_action_from_unverified_creator_used
    path: .github/workflows/stack-prune.yaml
